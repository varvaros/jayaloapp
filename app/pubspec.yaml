name: jayalo_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# El +N es el versionCode: cada subida a Play lo QUEMA para siempre. Los APK
# de device van por numeros intermedios sin commitear (45, 47...); aqui queda
# commiteado el del AAB para que nadie recompile a ciegas con uno ya usado.
version: 1.0.4+106

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Traducciones de los widgets de Material (calendario, reloj, menu de
  # seleccion de texto, "Cancelar"/"Aceptar"...). Viene DENTRO del SDK de
  # Flutter: cero descarga extra. Sin esto, `showDatePicker` y `showTimePicker`
  # salen en INGLES aunque toda la app este escrita en espanol.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  google_sign_in: 6.2.2
  go_router: ^17.3.0
  # Caché de imágenes EN DISCO (persiste entre arranques): las fotos ya vistas
  # cargan al instante en vez de re-descargarse cada vez que se abre la app.
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  # Deep link de retorno tras recargar por PayPal en la web (jayalo://wallet).
  app_links: ^6.3.2
  http: ^1.6.0
  webview_flutter: ^4.14.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  geolocator: ^14.0.0
  image_picker: ^1.2.1
  # Recorte de la foto tras tomarla/elegirla (pedido PO: al solicitar aparece
  # un crop). Requiere la UCropActivity en el AndroidManifest.
  image_cropper: ^9.1.0
  # Recompresión Dart-pura de la foto que viaja a la IA (768 px, F2). Ya
  # estaba resuelta como transitiva de flutter_launcher_icons: promoverla es
  # cero descarga y cero código nativo.
  image: ^4.8.0
  # La hoja nativa de compartir de Android/iOS (pedido PO 2026-08-30). En el
  # movil SIEMPRE existe, asi que aqui no hace falta el respaldo al
  # portapapeles que si lleva la web.
  share_plus: ^12.0.0
  shared_preferences: ^2.5.2
  # Versión/build number de la app para el campo `release` del reporte de
  # errores (task 12, reporter Flutter → /api/public/hooks/report-error).
  package_info_plus: ^8.0.0
  flutter_animate: ^4.5.0
  # Reproduce las animaciones Lottie de la mascota Jayi (exportadas del SVG de
  # Adobe Animate del PO → conversor propio). Hoy: la celebración del salto
  # (`jayi_celebrando`) en las pantallas de éxito. Reemplaza al CustomPainter
  # `MascotMood.celebrate` en esos overlays; el resto de la mascota sigue en
  # `JayaloMascotFace`.
  lottie: ^3.3.2
  # Reproduce los efectos de sonido de las dos celebraciones deliberadas
  # (oferta aceptada / contacto desbloqueado). Pedido PO 2026-07-21: sonido en
  # ambas. Solo se usa para SFX cortos empaquetados como asset.
  audioplayers: ^6.1.0
  # En dependencies (no dev_dependencies) a propósito: como dev_dependency el
  # Gradle de Flutter la EXCLUYE del classpath de release pero el
  # GeneratedPluginRegistrant la referencia igual → `flutter build apk
  # --release` no compila ("package dev.flutter.plugins.integration_test does
  # not exist", visto 2026-07-19 tras un flutter clean; lógica en
  # PluginHandler.kt:115 del SDK). Aquí es inerte en producción: solo se
  # activa al correr con `am instrument`.
  integration_test:
    sdk: flutter
  app_badge_plus: ^1.3.2
  smart_auth: ^3.2.0
  flutter_local_notifications: ^22.2.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Ícono de la app (render 3D de Jayi, imagen EXACTA del PO 2026-08-10 —
# photo_2026-08-07_10-46-39.png; sustituye al isotipo plano del 07-21):
# genera el mipmap legacy Y el adaptativo (`dart run flutter_launcher_icons`).
# `icon.png` es la imagen tal cual (mipmap sin máscara). `icon_foreground.png`
# la lleva al 68% del lienzo centrada sobre sí misma difuminada — la "zona
# segura": el launcher zoomea ~1.5× el drawable adaptativo, así el recorte
# muestra la imagen COMPLETA y el margen difuminado solo asoma en el parallax.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # Lila del fondo de la imagen (promedio de esquinas).
  adaptive_icon_background: "#9976E4"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/mascot.png
    - assets/images/chat-bg.jpg
    # Jayi 3D de la «PORTADA JAYI» del login (webp CON canal alfa, 218 KB).
    - assets/images/jayi-hero.webp
    - assets/sounds/oferta_aceptada.mp3
    - assets/sounds/desbloqueo.mp3
    # Avisos de mensaje con la app ABIERTA. Con la app cerrada el sonido lo pone
    # el canal de Android, no estos assets (ver MainActivity.kt).
    - assets/sounds/mensaje_en_chat.mp3
    - assets/sounds/mensaje_nuevo.mp3
    # Ting-ting-ting de la acreditacion de creditos (lo trajo el PO, 08-23).
    - assets/sounds/monedas_acreditadas.mp3
    # Animaciones Lottie de Jayi celebrando (violeta para fondos claros; blanca
    # para el fondo violeta de la celebración a pantalla completa).
    - assets/anim/jayi_celebrando.json
    - assets/anim/jayi_celebrando_blanco.json

  # Nunito (variable, eje wght 200-1000; OFL, de google/fonts): la tipografía
  # redondeada de la marca en la web (`--font-rounded`). En la app se usa en
  # los textos de la celebración de desbloqueo (pedido PO 2026-07-22). Al ser
  # variable, el peso se pide con `fontVariations: [FontVariation('wght', N)]`
  # — `fontWeight` solo no basta.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
